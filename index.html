<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>말과 글 수첩 · 국어 5-2</title><link href="https://fonts.googleapis.com/css2?family=Jua&family=Gaegu:wght@400;700&family=Gowun+Dodum&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css"></head><body><div class="wrap">
<header class="center" style="margin-top:20px">
<div class="eyebrow">국어 5학년 2학기</div>
<h1>말과 글 <span class="em">수첩</span></h1></header>

<div class="hero">
  <div class="tape"></div>
  <div class="ring">
    <svg width="126" height="126" viewBox="0 0 126 126">
      <circle cx="63" cy="63" r="52" fill="none" stroke="#E4DDC8" stroke-width="9"/>
      <circle id="prog" cx="63" cy="63" r="52" fill="none" stroke="#2F7D5D" stroke-width="9"
              stroke-linecap="round" stroke-dasharray="327" stroke-dashoffset="327"/>
    </svg>
    <div class="val"><div><div class="big" id="pct">0</div><div class="sub">개 해결</div></div></div>
  </div>
  <h2 id="heroTitle">오늘의 복습을 시작해요</h2>
  <p id="heroSub">5분이면 충분해요.</p>
  <a class="btn" id="heroBtn" href="lesson/1.html">시작하기</a>
</div>

<h2 class="sec"><span class="num">단원.</span> 수첩의 단원들</h2>
<p class="lead">아직 배우지 않은 곳도 미리 펼쳐 볼 수 있어요.</p>
<div class="list">
<a class="item" href="unit1.html"><div class="stamp"><span>1</span></div>
<div class="it-body"><div class="it-label">1단원</div><div class="it-title">작품에 대한 의견을 나누어요</div></div>
<div class="it-go">›</div></a>
<div class="item" style="opacity:.45"><div class="stamp"><span>2</span></div>
<div class="it-body"><div class="it-label">2단원</div><div class="it-title">올바른 문장으로 글을 써요 — 준비 중</div></div></div>
<div class="item" style="opacity:.45"><div class="stamp"><span>3</span></div>
<div class="it-body"><div class="it-label">3단원</div><div class="it-title">표준어와 방언을 알아봐요 — 준비 중</div></div></div>
</div>

<div class="foot">국어 5-2 · 말과 글 수첩<br>
<a href="teacher.html" style="color:var(--dim);text-decoration:underline">선생님께</a> ·
<a href="#" id="rst" style="color:var(--dim);text-decoration:underline">수첩 비우기</a></div>
</div>
<script src="assets/app.js"></script>
<script>
var SEQ=[["l","1","1차시 인상적인 부분이란","lesson/1.html"],
         ["l","2-3","2~3차시 말에도 색깔이 있지","lesson/2-3.html"]];
var n=P.doneCount(), total=SEQ.length;
document.getElementById('pct').textContent=n;
var C=327, off=C-(C*(total?Math.min(n/total,1):0));
document.getElementById('prog').setAttribute('stroke-dashoffset',off);
var next=SEQ.find(function(s){return !P.isDone(s[1])});
if(next){
  document.getElementById('heroTitle').textContent = n? '이어서 하기' : '오늘의 복습을 시작해요';
  document.getElementById('heroSub').textContent = next[2];
  document.getElementById('heroBtn').href = next[3];
  document.getElementById('heroBtn').textContent = n? '이어서 하기' : '시작하기';
}else{
  document.getElementById('heroTitle').textContent='모두 해결했어요!';
  document.getElementById('heroSub').textContent='새 차시가 올라오면 여기에 표시됩니다.';
  document.getElementById('heroBtn').href='unit1.html';
  document.getElementById('heroBtn').textContent='차시 목록';
}
document.getElementById('rst').addEventListener('click',function(e){
  e.preventDefault();
  if(confirm('수첩의 도장을 모두 지울까요?')){P.reset();location.reload();}
});
</script></body></html>
