<script>
/*

  1. Firebase 콘솔에서 이 수업 전용 새 프로젝트를 만든다. 기존 프로젝트는 재사용하지 않는다.
  2. Firestore Database를 프로덕션 모드, asia-northeast3(서울) 위치에 만든다.
  3. Firestore Database > 규칙에 아래 내용을 그대로 붙여넣고 게시한다.
     rules_version = '2';
     service cloud.firestore {
       match /databases/{database}/documents {
         match /act1/s0916 {
           allow read, write: if request.time < timestamp.value(1789570800000);
           match /{document=**} {
             allow read, write: if request.time < timestamp.value(1789570800000);
           }
         }
       }
     }
  4. 프로젝트 설정에서 웹 앱을 등록한다. Authentication은 켜지 않는다.
  5. 발급된 firebaseConfig를 아래 상수 한 곳에 그대로 복사한다.
*/
const firebaseConfig = Object.freeze({
  apiKey: "AIzaSyD9E86qHToh_f_fNVAcYQldyjCPpARZB-Q",
  authDomain: "open-cbd39.firebaseapp.com",
  projectId: "open-cbd39",

});
const ROOM = "s0916";

<style>
:root{--bg:#EAF1F6;--ink:#1E2A38;--muted:#5B6B7C;--panel:#FFF;--warn:#FF6A45;--ok:#2E9E6B;--line:#D6DFE7;--shadow:0 3px 0 #C9D5DF;--yellow:#FFD75E}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:"Gowun Dodum","Malgun Gothic",sans-serif;-webkit-user-select:none;user-select:none;touch-action:manipulation}
button,input{font:inherit}
button{border:0;cursor:pointer;touch-action:none}
#app{height:100dvh;display:grid;grid-template-rows:minmax(0,1fr) auto}
.screen{min-height:0;padding:clamp(14px,1.6vw,30px);padding-bottom:12px}
.view{height:100%;display:none}.view.on{display:flex}
.waiting{flex-direction:column;align-items:center;justify-content:center;gap:clamp(18px,2.5vh,34px)}
.eyebrow{font-size:clamp(18px,1.5vw,28px);color:var(--muted)}
h1,.round-title,.draw-title{font-family:"Jua",sans-serif;font-weight:400;letter-spacing:-.02em}
h1{font-size:clamp(42px,4.3vw,78px);line-height:1.05;text-align:center}
.presence-summary{display:flex;gap:12px;align-items:center;font-family:"Jua",sans-serif;font-size:clamp(20px,2vw,34px)}
.presence-summary b{color:var(--ok);font-weight:400}
.number-grid{width:min(1200px,90vw);display:grid;grid-template-columns:repeat(14,1fr);gap:clamp(8px,.8vw,14px)}
.student{aspect-ratio:1;border-radius:18px;background:#DCE5EC;color:#8A98A6;display:grid;place-items:center;font-family:"Jua",sans-serif;font-size:clamp(24px,2.2vw,40px);box-shadow:inset 0 -3px 0 #CAD5DE;transition:.2s transform,.2s background,.2s color}
.student.online{background:#EAF7F0;color:var(--ok);box-shadow:inset 0 -3px 0 #B9DEC9;transform:translateY(-2px)}
.student.used{background:#F1F3F5;color:#B7C0C8;box-shadow:none}
.drawing{flex-direction:column;align-items:center;justify-content:center;gap:clamp(18px,3vh,42px)}
.draw-title{font-size:clamp(54px,6vw,108px);color:var(--warn)}
.draw-slots{display:flex;justify-content:center;gap:clamp(18px,2.4vw,46px)}
.draw-person{width:clamp(240px,25vw,400px);background:var(--panel);border-radius:32px;padding:clamp(20px,2vw,34px);display:grid;justify-items:center;gap:10px;box-shadow:var(--shadow);border:4px solid transparent;transition:.25s transform,.25s border-color}
.draw-person.stopped{border-color:var(--ok);transform:translateY(-8px)}
.rolling-number{font-family:"Jua",sans-serif;font-size:clamp(76px,8vw,144px);line-height:1;color:var(--ink);font-variant-numeric:tabular-nums}
.draw-role{font-family:"Jua",sans-serif;font-size:clamp(26px,2.5vw,44px);color:var(--warn)}
.game{flex-direction:column;gap:12px}
.game-head{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:18px;min-height:80px}
.round-title{font-size:clamp(34px,3vw,58px);color:var(--warn)}
.member-row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.member-chip{display:flex;align-items:center;gap:8px;background:var(--panel);border:2px solid var(--line);border-radius:999px;padding:.3em .75em;font-family:"Jua",sans-serif;font-size:clamp(19px,1.5vw,28px)}
.member-chip span{color:var(--warn)}
.timer{justify-self:end;width:86px;height:64px;border-radius:18px;background:var(--ink);color:#fff;display:grid;place-items:center;font-family:"Jua",sans-serif;font-size:36px;font-variant-numeric:tabular-nums}
.timer.zero{background:var(--warn);animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.06)}}
.game-main{min-height:0;flex:1;display:grid;grid-template-columns:minmax(0,1.32fr) minmax(520px,1fr);gap:clamp(16px,2vw,30px)}
.art-card{position:relative;min-height:0;background:#F3E9DA;border-radius:28px;overflow:hidden;box-shadow:0 2px 0 var(--line);display:grid;place-items:center}
.art-card img{width:100%;height:100%;object-fit:contain;display:block;transition:filter .7s ease,transform .7s ease;will-change:filter}
.art-card.blurred img{filter:blur(24px) saturate(.65);transform:scale(1.06)}
.veil{position:absolute;inset:0;background:rgba(234,241,246,.16);pointer-events:none;transition:opacity .5s}.art-card:not(.blurred) .veil{opacity:0}
.piece-panel{min-height:0;display:flex;flex-direction:column;justify-content:center;gap:clamp(12px,1.6vh,20px)}
.piece{position:relative;min-height:clamp(104px,12vh,142px);background:var(--panel);border-radius:24px;border:4px solid var(--line);box-shadow:0 2px 0 var(--line);padding:12px 22px;display:grid;place-items:center;overflow:hidden;transition:.25s border-color,.25s background,.25s transform;cursor:pointer}
.piece.typing{border-color:var(--yellow);background:#FFF9DF;transform:translateX(-4px)}
.piece.submitted{border-color:var(--ok);background:#F0FAF5}
.piece-role{position:absolute;left:18px;top:11px;font-size:clamp(15px,1.1vw,20px);color:var(--muted)}
.piece-text{font-family:"Jua",sans-serif;font-size:clamp(38px,3vw,58px);line-height:1.15;text-align:center;word-break:keep-all}
.piece:not(.revealed) .piece-text{color:#A5B0BA;letter-spacing:.14em}
.teacher-input{width:86%;border:0;border-bottom:4px solid var(--warn);background:transparent;color:var(--ink);outline:0;text-align:center;font-family:"Jua",sans-serif;font-size:clamp(34px,2.8vw,54px);padding:.18em .3em;-webkit-user-select:text;user-select:text}
.stamp{position:absolute;right:15px;top:12px;border:3px solid var(--ok);color:var(--ok);font-family:"Jua",sans-serif;border-radius:50%;width:58px;height:58px;display:none;place-items:center;transform:rotate(-12deg);font-size:17px}.submitted .stamp{display:grid}
.piece.revealed{opacity:0;transform:translateY(18px);border-color:var(--warn);background:#FFF7F4;cursor:default}
.piece.revealed.show{animation:pieceIn .44s cubic-bezier(.2,.9,.3,1.15) forwards}
@keyframes pieceIn{to{opacity:1;transform:none}}
.sentence-strip{height:clamp(74px,9vh,104px);background:var(--panel);border-radius:22px;padding:10px 16px;display:flex;gap:12px;align-items:center;overflow-x:auto;box-shadow:0 2px 0 var(--line);scrollbar-width:none}.sentence-strip::-webkit-scrollbar{display:none}
.sentence-chip{flex:0 0 auto;border-radius:14px;background:#F2F6F9;color:var(--ink);padding:.45em .75em;font-family:"Jua",sans-serif;font-size:clamp(18px,1.4vw,25px);white-space:nowrap}.sentence-chip b{color:var(--warn);font-weight:400;margin-right:.35em}
.empty-strip{color:var(--muted);font-size:18px;margin:auto}
.controls{height:clamp(88px,10vh,116px);background:rgba(255,255,255,.94);border-top:2px solid var(--line);display:flex;align-items:center;justify-content:center;gap:clamp(12px,1.4vw,24px);padding:12px 24px}
.control{position:relative;min-width:clamp(180px,15vw,270px);height:clamp(62px,7vh,82px);border-radius:22px;background:var(--ink);color:#fff;font-family:"Jua",sans-serif;font-size:clamp(24px,2vw,36px);box-shadow:0 4px 0 #101923;overflow:hidden}
.control.reveal{background:var(--warn);box-shadow:0 4px 0 #C94729}.control.redraw{background:#6B7B8C;box-shadow:0 4px 0 #465563}.control.reset{background:var(--panel);color:var(--muted);border:3px solid var(--line);box-shadow:0 4px 0 var(--line)}
.control:disabled{opacity:.34;cursor:not-allowed;box-shadow:none}.control:active:not(:disabled){transform:translateY(3px);box-shadow:none}
.hold-fill{position:absolute;inset:auto 0 0;height:0;background:rgba(255,106,69,.28);pointer-events:none}.reset.holding .hold-fill{height:100%;transition:height 1.5s linear}
.mode-badge{position:fixed;top:10px;right:12px;background:#FFF3CD;color:#805C00;border-radius:999px;padding:5px 12px;font-size:14px;z-index:9;display:none}.mode-badge.on{display:block}
.toast{position:fixed;left:50%;top:18px;transform:translate(-50%,-20px);background:var(--ink);color:#fff;border-radius:999px;padding:.65em 1.3em;font-size:20px;opacity:0;pointer-events:none;transition:.25s;z-index:20}.toast.on{opacity:1;transform:translate(-50%,0)}
@media(max-width:1050px){.number-grid{grid-template-columns:repeat(9,1fr)}.game-main{grid-template-columns:1fr minmax(390px,.85fr)}.member-chip{font-size:18px}.control{min-width:160px}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div id="app">
  <main class="screen">
    <section id="waitingView" class="view waiting on">
      <div class="eyebrow">문장 성분의 호응 관계 · 활동 1</div>
      <h1>모두 들어왔나요?</h1>
      <div class="presence-summary"><b id="onlineCount">0명</b><span>접속했어요</span></div>
      <div id="numberGrid" class="number-grid" aria-label="학생 접속 현황"></div>
    </section>
    <section id="drawingView" class="view drawing">
      <div id="drawTitle" class="draw-title">번호를 뽑아요!</div>
      <div id="drawSlots" class="draw-slots"></div>
    </section>
    <section id="gameView" class="view game">
      <div class="game-head">
        <div id="roundTitle" class="round-title"></div>
        <div id="memberRow" class="member-row"></div>
        <div id="timer" class="timer">15</div>
      </div>
      <div class="game-main">
        <figure id="artCard" class="art-card blurred"><img id="sceneImage" src="img/01-yangmal.png" alt="현재 문제 그림"><i class="veil"></i></figure>
        <div id="piecePanel" class="piece-panel"></div>

      <div id="sentenceStrip" class="sentence-strip"></div>
    </section>
  </main>
  <nav class="controls" aria-label="교사 조작">
    <button id="nextBtn" class="control">다음 팀</button>
    <button id="revealBtn" class="control reveal" disabled>공개</button>
    <button id="redrawBtn" class="control redraw" disabled>다시 뽑기</button>
    <button id="resetBtn" class="control reset"><span>다시</span><i class="hold-fill"></i></button>
  </nav>
</div>
<div id="modeBadge" class="mode-badge">Firebase 설정 전 · 점검 모드</div>
<div id="toast" class="toast" role="status"></div>
<script type="module">
const IMAGE_FILES=["01-yangmal.png","02-kimchi.png","03-songpyeon.png","04-moja.png","05-goyangi.png","06-gita.png","07-gongnori.png","08-pungseon.png","09-guksu.png"];
const STUDENT_NUMBERS=[...Array.from({length:15},(_,i)=>i+1),...Array.from({length:13},(_,i)=>i+51)];
const ROLE_ORDER=["subject","object","predicate"];
const ROLE_LABEL={subject:"누가?",object:"무엇을?",predicate:"어떻게 한다?"};
const ROOM_PATH=`act1/${ROOM}`;
const $=id=>document.getElementById(id);
const els={waiting:$('waitingView'),drawing:$('drawingView'),game:$('gameView'),grid:$('numberGrid'),count:$('onlineCount'),drawSlots:$('drawSlots'),roundTitle:$('roundTitle'),members:$('memberRow'),timer:$('timer'),art:$('artCard'),image:$('sceneImage'),pieces:$('piecePanel'),strip:$('sentenceStrip'),next:$('nextBtn'),reveal:$('revealBtn'),redraw:$('redrawBtn'),reset:$('resetBtn'),badge:$('modeBadge'),toast:$('toast')};
let room={},transport,drawToken='',timerId=0,toastId=0,lastPhase='';

const imageUrl=name=>new URL(`img/${name}`,document.baseURI).href;
for(const n of STUDENT_NUMBERS){const cell=document.createElement('div');cell.className='student';cell.dataset.no=n;cell.textContent=n;els.grid.append(cell)}
const preloadImages=()=>IMAGE_FILES.forEach((name,index)=>{const img=new Image();img.decoding='async';img.fetchPriority=index===0?'high':'low';img.src=imageUrl(name)});
if('requestIdleCallback'in window)requestIdleCallback(preloadImages,{timeout:1800});else setTimeout(preloadImages,300);

function blankRoom(){return{state:{phase:'waiting',round:-1,picked:[],imageIndex:0,startedAt:0,inputStartedAt:0},presence:{},used:{},drafts:{},rounds:{},sentences:{}}}
function clone(v){return JSON.parse(JSON.stringify(v??null))}
function pathSet(obj,path,value){const keys=path.split('/').filter(Boolean);let cur=obj;keys.slice(0,-1).forEach(k=>cur=cur[k]??={});const last=keys.at(-1);if(value===null)delete cur[last];else cur[last]=value}
function validConfig(){return firebaseConfig.apiKey&&firebaseConfig.apiKey!=="PASTE_HERE"&&!firebaseConfig.projectId.includes("PASTE_HERE")}

function mockTransport(){
  const key=`act1-demo-${ROOM}`,channel=new BroadcastChannel(key);let listener=()=>{};
  const load=()=>{try{return JSON.parse(localStorage.getItem(key))||blankRoom()}catch{return blankRoom()}};
  const save=data=>{localStorage.setItem(key,JSON.stringify(data));channel.postMessage('change');listener(clone(data))};
  channel.onmessage=()=>listener(clone(load()));window.addEventListener('storage',e=>{if(e.key===key)listener(clone(load()))});
  return{demo:true,subscribe(fn){listener=fn;fn(clone(load()))},async patch(changes){const data=load();Object.entries(changes).forEach(([p,v])=>pathSet(data,p,v));save(data)},async transaction(fn){const current=load(),next=fn(clone(current));if(next!==undefined)save(next);return next},async clearRound(round){const data=load();data.drafts[round]={};save(data)},async reset(){const data=load(),fresh=blankRoom();fresh.presence=data.presence||{};save(fresh)}}
}

async function firebaseTransport(){
  const appMod=await import('https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js');
  const fs=await import('https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js');
  const app=appMod.initializeApp(firebaseConfig),db=fs.initializeFirestore(app,{localCache:fs.memoryLocalCache()}),roomRef=fs.doc(db,'act1',ROOM),presenceRef=fs.collection(roomRef,'presence');
  let cache=blankRoom(),listener=()=>{},draftUnsub=()=>{},draftRound=-2;
  const rootPayload=data=>({state:data.state||blankRoom().state,used:data.used||{},rounds:data.rounds||{},sentences:data.sentences||{}});
  const emit=()=>listener(clone(cache));
  const watchDrafts=round=>{if(round===draftRound)return;draftUnsub();draftRound=round;if(round<0)return;cache.drafts[round]={};const ref=fs.collection(roomRef,'rounds',`r${round+1}`,'drafts');draftUnsub=fs.onSnapshot(ref,snap=>{cache.drafts[round]={};snap.forEach(d=>cache.drafts[round][d.id]=d.data());emit()},err=>{console.error(err);showToast('Firestore 입력 자료를 읽지 못했어요.')})};
  const unsubRoom=fs.onSnapshot(roomRef,async snap=>{if(!snap.exists()){await fs.setDoc(roomRef,rootPayload(blankRoom()));return}const data=snap.data();cache={...cache,...data,state:{...blankRoom().state,...(data.state||{})},used:data.used||{},rounds:data.rounds||{},sentences:data.sentences||{}};watchDrafts(cache.state.round);emit()},err=>{console.error(err);showToast('Firestore 방에 연결하지 못했어요.')});
  const unsubPresence=fs.onSnapshot(presenceRef,snap=>{cache.presence={};const cutoff=Date.now()-35000;snap.forEach(d=>{const v=d.data(),seen=v.lastSeen?.toMillis?.()||v.clientAt||0;if(v.online!==false&&seen>cutoff)cache.presence[d.id]=v});emit()},err=>{console.error(err);showToast('접속 명단을 읽지 못했어요.')});
  const prune=setInterval(()=>emit(),5000);
  return{demo:false,subscribe(fn){listener=fn;emit()},async patch(changes){const grouped={};Object.entries(changes).forEach(([path,value])=>{const [root,round,key,...rest]=path.split('/');if(root!=='drafts')return;const id=`${round}/${key}`,entry=grouped[id]??={round:+round,key,data:{},replace:false};if(!rest.length){entry.data=value;entry.replace=true}else entry.data[rest.join('.')]=value});const batch=fs.writeBatch(db);Object.values(grouped).forEach(g=>batch.set(fs.doc(roomRef,'rounds',`r${g.round+1}`,'drafts',g.key),g.data,{merge:!g.replace}));await batch.commit()},async transaction(fn){let result;await fs.runTransaction(db,async tx=>{const snap=await tx.get(roomRef),base=normalize({...cache,...(snap.exists()?snap.data():{})}),next=fn(base);if(next===undefined)return;result=next;tx.set(roomRef,rootPayload(next))});return result},async clearRound(round){const batch=fs.writeBatch(db);ROLE_ORDER.forEach(key=>batch.delete(fs.doc(roomRef,'rounds',`r${round+1}`,'drafts',key)));await batch.commit()},async reset(){const batch=fs.writeBatch(db);for(let round=0;round<IMAGE_FILES.length;round++)ROLE_ORDER.forEach(key=>batch.delete(fs.doc(roomRef,'rounds',`r${round+1}`,'drafts',key)));batch.set(roomRef,rootPayload(blankRoom()));await batch.commit()},destroy(){clearInterval(prune);unsubRoom();unsubPresence();draftUnsub()}}
}

function normalize(data){const b=blankRoom();return{...b,...(data||{}),state:{...b.state,...(data?.state||{})},presence:data?.presence||{},used:data?.used||{},drafts:data?.drafts||{},rounds:data?.rounds||{},sentences:data?.sentences||{}}}
function presentNumbers(data=room){const cutoff=Date.now()-35000;return Object.entries(data.presence||{}).filter(([,v])=>{if(v===false||v?.online===false)return false;const seen=(v?.lastSeen?.seconds||0)*1000||v?.clientAt||v?.at||0;return!seen||seen>cutoff}).map(([k])=>Number(k)).filter(n=>STUDENT_NUMBERS.includes(n)).sort((a,b)=>a-b)}
function availableNumbers(data=room){return presentNumbers(data).filter(n=>!data.used?.[n])}
function ownerMap(members){if(members.length>=3)return{subject:members[0],object:members[1],predicate:members[2]};if(members.length===2)return{subject:members[0],object:members[0],predicate:members[1]};return{subject:members[0],object:members[0],predicate:members[0]}}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function showToast(text){clearTimeout(toastId);els.toast.textContent=text;els.toast.classList.add('on');toastId=setTimeout(()=>els.toast.classList.remove('on'),1800)}

function render(data){
  room=normalize(data);const s=room.state,present=presentNumbers(),available=availableNumbers();
  els.count.textContent=`${present.length}명`;
  [...els.grid.children].forEach(c=>{const n=+c.dataset.no;c.classList.toggle('online',present.includes(n));c.classList.toggle('used',!!room.used[n])});
  const phase=s.phase||'waiting';
  els.waiting.classList.toggle('on',phase==='waiting');els.drawing.classList.toggle('on',phase==='drawing');els.game.classList.toggle('on',['input','revealed','finished'].includes(phase));
  if(phase==='drawing')startDrawAnimation(s);
  if(['input','revealed','finished'].includes(phase))renderGame(phase,lastPhase);
  const noMore=available.length===0||s.round>=IMAGE_FILES.length-1;
  els.next.disabled=phase==='drawing'||phase==='input'||phase==='finished'||(phase==='waiting'&&available.length===0)||(phase==='revealed'&&noMore);
  els.next.textContent=(phase==='revealed'&&noMore)||phase==='finished'?'끝!':'다음 팀';
  els.reveal.disabled=phase!=='input';
  els.redraw.disabled=!['drawing','input'].includes(phase);
  lastPhase=phase;
}

function startDrawAnimation(s){
  const token=`${s.round}-${s.startedAt}`;if(drawToken===token)return;drawToken=token;
  const members=s.picked||[],roles=ownerMap(members),present=presentNumbers();els.drawSlots.innerHTML='';
  members.forEach((member,i)=>{const role=ROLE_ORDER.find(key=>roles[key]===member&&(!ROLE_ORDER.slice(0,ROLE_ORDER.indexOf(key)).some(prev=>roles[prev]===member)))||ROLE_ORDER[i];const owned=ROLE_ORDER.filter(k=>roles[k]===member).map(k=>ROLE_LABEL[k]).join(' · ');const card=document.createElement('div');card.className='draw-person';card.innerHTML=`<div class="rolling-number">?</div><div class="draw-role">${owned}</div>`;els.drawSlots.append(card)});
  const cards=[...els.drawSlots.children],elapsed=Math.max(0,Date.now()-(s.startedAt||Date.now())),stops=[650,1050,1450];
  const tick=setInterval(()=>cards.forEach((card,i)=>{if(elapsed+performance.now()%100000<0)return;if(!card.classList.contains('stopped'))card.querySelector('.rolling-number').textContent=present[Math.floor(Math.random()*present.length)]||STUDENT_NUMBERS[Math.floor(Math.random()*STUDENT_NUMBERS.length)]}),70);
  cards.forEach((card,i)=>setTimeout(()=>{card.querySelector('.rolling-number').textContent=members[i];card.classList.add('stopped')},Math.max(0,stops[i]-elapsed)));
  setTimeout(async()=>{clearInterval(tick);await transport.transaction(data=>{data=normalize(data);if(data.state.phase==='drawing'&&data.state.round===s.round&&data.state.startedAt===s.startedAt){data.state.phase='input';data.state.inputStartedAt=Date.now()}return data})},Math.max(0,1500-elapsed));
}

function renderGame(phase,previousPhase){
  const s=room.state,round=s.round,members=s.picked||[],owners=ownerMap(members),drafts=room.drafts?.[round]||{};
  els.roundTitle.textContent=phase==='finished'?'끝!':`${round+1}번째 모둠!`;
  els.members.innerHTML=members.map(n=>{const labels=ROLE_ORDER.filter(k=>owners[k]===n).map(k=>ROLE_LABEL[k]).join(' · ');return`<div class="member-chip"><b>${n}번</b><span>${labels}</span></div>`}).join('');
  els.image.src=imageUrl(IMAGE_FILES[Math.max(0,s.imageIndex||0)]);els.art.classList.toggle('blurred',phase!=='revealed'&&phase!=='finished');
  els.pieces.innerHTML='';
  ROLE_ORDER.forEach((key,index)=>{const d=drafts[key]||{},revealed=phase==='revealed'||phase==='finished',piece=document.createElement('div');piece.className=`piece${d.typing?' typing':''}${d.submitted?' submitted':''}${revealed?' revealed':''}`;piece.dataset.role=key;const shown=revealed?(d.text?.trim()||'___'):'???';piece.innerHTML=`<span class="piece-role">${ROLE_LABEL[key]} · ${owners[key]||'-'}번</span><strong class="piece-text">${escapeHtml(shown)}</strong><i class="stamp">냈어요</i>`;if(!revealed)piece.addEventListener('click',()=>teacherFill(key,piece));els.pieces.append(piece);if(revealed){const delay=index*600,age=Date.now()-(s.revealedAt||0);setTimeout(()=>piece.classList.add('show'),previousPhase==='input'?delay:Math.max(0,delay-age))}});
  renderSentences();startTimer(phase,s.inputStartedAt);
}
function renderSentences(){const entries=Object.entries(room.sentences||{}).sort((a,b)=>+a[0]-+b[0]);els.strip.innerHTML=entries.length?entries.map(([i,p])=>`<div class="sentence-chip"><b>${+i+1}</b>${escapeHtml([p.subject,p.object,p.predicate].filter(Boolean).join(' '))}</div>`).join(''):'<span class="empty-strip">공개된 문장이 여기에 차곡차곡 쌓여요.</span>';els.strip.scrollLeft=els.strip.scrollWidth}
function startTimer(phase,startedAt){clearInterval(timerId);const paint=()=>{const left=phase==='input'?Math.max(0,15-Math.floor((Date.now()-(startedAt||Date.now()))/1000)):0;els.timer.textContent=String(left);els.timer.classList.toggle('zero',phase==='input'&&left===0)};paint();if(phase==='input')timerId=setInterval(paint,250)}
function escapeHtml(v){return String(v??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}

async function drawNext(redraw=false){
  const targetRound=redraw?room.state.round:room.state.round+1;if(targetRound>=0&&(redraw||availableNumbers().length))await transport.clearRound(targetRound);
  await transport.transaction(data=>{data=normalize(data);const s=data.state;if(redraw&&!['drawing','input'].includes(s.phase))return data;if(!redraw&&!['waiting','revealed'].includes(s.phase))return data;if(redraw){(s.picked||[]).forEach(n=>delete data.used[n]);data.drafts[s.round]={}}const available=availableNumbers(data);if(!available.length){if(!redraw)s.phase='finished';return data}const count=Math.min(3,available.length),picked=shuffle([...available]).slice(0,count),round=redraw?s.round:s.round+1;if(round>=IMAGE_FILES.length){s.phase='finished';return data}picked.forEach(n=>data.used[n]=true);data.drafts[round]={};data.rounds[round]={members:picked,imageIndex:round};data.state={phase:'drawing',round,picked,imageIndex:round,startedAt:Date.now(),inputStartedAt:0,revealedAt:0};return data});
}
async function reveal(){await transport.transaction(data=>{data=normalize(data);if(data.state.phase!=='input')return data;const r=data.state.round,d=data.drafts?.[r]||{};data.sentences[r]={subject:d.subject?.text?.trim()||'___',object:d.object?.text?.trim()||'___',predicate:d.predicate?.text?.trim()||'___'};data.rounds[r]={...(data.rounds[r]||{}),revealed:true};data.state.phase='revealed';data.state.revealedAt=Date.now();return data})}
function teacherFill(key,piece){
  if(room.state.phase!=='input'||piece.querySelector('input'))return;
  const current=room.drafts?.[room.state.round]?.[key]?.text||'',input=document.createElement('input');
  input.className='teacher-input';input.maxLength=30;input.value=current;input.setAttribute('aria-label',`${ROLE_LABEL[key]} 교사 입력`);
  piece.querySelector('.piece-text').replaceWith(input);input.addEventListener('click',e=>e.stopPropagation());
  let done=false;const save=async()=>{if(done)return;done=true;const value=input.value.trim();if(!value){render(room);return}await transport.patch({[`drafts/${room.state.round}/${key}`]:{text:value,typing:true,submitted:true,owner:0,byTeacher:true,updatedAt:Date.now()}})};
  input.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();input.blur()}if(e.key==='Escape'){done=true;render(room)}});input.addEventListener('blur',save,{once:true});input.focus();input.select();
}
async function resetAll(){await transport.reset();showToast('처음 상태로 돌아갔어요.')}

els.next.addEventListener('click',()=>drawNext(false));els.reveal.addEventListener('click',reveal);els.redraw.addEventListener('click',()=>drawNext(true));
let holdTimer=0;
function cancelHold(){clearTimeout(holdTimer);holdTimer=0;els.reset.classList.remove('holding')}
els.reset.addEventListener('pointerdown',e=>{e.preventDefault();els.reset.setPointerCapture(e.pointerId);els.reset.classList.add('holding');holdTimer=setTimeout(()=>{holdTimer=0;els.reset.classList.remove('holding');resetAll()},1500)});
['pointerup','pointercancel','lostpointercapture','pointerleave'].forEach(type=>els.reset.addEventListener(type,cancelHold));

try{transport=validConfig()?await firebaseTransport():mockTransport();if(transport.demo)els.badge.classList.add('on');transport.subscribe(render)}catch(err){console.error(err);transport=mockTransport();els.badge.classList.add('on');showToast('Firebase 연결 실패 · 점검 모드로 열었어요.');transport.subscribe(render)}
</script>
</body>
